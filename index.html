<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AISECT Mizoram | Education & Career Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f7ff, #eef2f7);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      text-align: center;
      background: #ffffff;
      padding: 60px 35px;
      border-radius: 24px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: #5b3cc4;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      font-size: 42px;
      color: #222;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 20px;
      color: #5b3cc4;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .description {
      max-width: 600px;
      margin: auto;
      color: #666;
      font-size: 17px;
      line-height: 1.7;
    }

    .topics {
      margin: 35px 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .topic {
      padding: 12px 18px;
      background: #f1effb;
      color: #4b32a8;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
    }

    .chat-button {
      display: inline-block;
      padding: 17px 38px;
      background: #5b3cc4;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      transition: 0.2s;
    }

    .chat-button:hover {
      transform: translateY(-2px);
      background: #472ca5;
    }

    .footer {
      margin-top: 35px;
      font-size: 13px;
      color: #999;
    }

    @media (max-width: 600px) {
      .container {
        padding: 45px 20px;
      }

      h1 {
        font-size: 32px;
      }

      .subtitle {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">A</div>

    <h1>AISECT Mizoram</h1>

    <div class="subtitle">
      Your AI-Powered Education & Career Assistant
    </div>

    <p class="description">
      Ask anything about courses, admissions, universities,
      online programmes and skill development opportunities.
    </p>

    <div class="topics">
      <div class="topic">UG & PG Courses</div>
      <div class="topic">Admissions</div>
      <div class="topic">Skill Programmes</div>
      <div class="topic">Career Guidance</div>
    </div>

    <a href="https://cdn.botpress.cloud/webchat/v5.0/shareable.html?configUrl=https://files.bpcontent.cloud/2026/09/05/04/20260905044727-ONMYXS6S.json" 
   target="_blank" 
   class="chat-button">
   Start Chatting
</a>

    <div class="footer">
      AISECT Mizoram • Your Education Assistant
    </div>

  </main>

</body>
</html>
