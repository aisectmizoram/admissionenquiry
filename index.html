<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AISECT Mizoram</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      width: 100%;
      text-align: center;
      background: white;
      padding: 60px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .chat-button {
      display: inline-block;
      padding: 16px 30px;
      background: #4f46e5;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .chat-button:hover {
      background: #3730a3;
    }

    .small-text {
      margin-top: 25px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>AISECT Mizoram</h1>

    <p>
      Ask anything about courses, admissions,
      universities and skill programmes.
    </p>

    <a href="#" class="chat-button">
      Chat with AISECT Mizoram
    </a>

    <div class="small-text">
      Your AI-powered admission assistant
    </div>
  </div>

</body>
</html>
